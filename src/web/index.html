<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>MoneyWave — фінансовий простір</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css">
<script src="/app.js" type="module"></script>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <span class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9.5c2.2-2.4 4.3-2.4 6.5 0s4.3 2.4 6.5 0 3.6-2.2 5-1.6"/><path d="M3 15.5c2.2-2.4 4.3-2.4 6.5 0s4.3 2.4 6.5 0 3.6-2.2 5-1.6"/></svg></span>
      <span class="brand-name">MoneyWave<span class="brand-sub">Особистий фінансовий простір</span></span>
    </div>
    <nav class="nav" aria-label="Розділи">
      <div class="nav-label">Розділи</div>
      <button disabled data-page="overview"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7.5" height="9" rx="1.8"/><rect x="13.5" y="3" width="7.5" height="5" rx="1.8"/><rect x="13.5" y="11" width="7.5" height="10" rx="1.8"/><rect x="3" y="15" width="7.5" height="6" rx="1.8"/></svg>Огляд</button>
      <button disabled data-page="budget"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 13.5A8.5 8.5 0 1 1 10.5 3.5v10z"/><path d="M14 3.2a8.5 8.5 0 0 1 6.8 6.8H14z"/></svg>Бюджет</button>
      <button disabled data-page="events"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>Поїздки й події</button>
      <button disabled data-page="purchases"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2.5 3 6.5v13a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-13l-3-4z"/><path d="M3 6.5h18"/><path d="M16 10.5a4 4 0 0 1-8 0"/></svg>Великі покупки</button>
      <button disabled data-page="transactions"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 6h12M8.5 12h12M8.5 18h12"/><path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>Операції</button>
    </nav>
    <div class="aside-bottom">
      <button class="side-link" id="history" disabled><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7.5V12l3 2"/></svg>Історія правок</button>
      <div class="privacy"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span><b>Локально на цьому Mac</b>Зашифроване збереження</span></div>
    </div>
  </aside>
  <main class="workspace">
    <div class="masthead">
      <div class="topbar">
        <div class="route-navigation"><div class="navigation-controls"><button id="navigation-back" class="chip navigation-back" data-action="back" disabled hidden>← Назад</button><button id="navigation-forward" class="chip navigation-back" data-action="forward" aria-label="Уперед" title="Уперед" hidden>→</button></div><span class="crumb">Фінанси / <b id="chapter">Огляд</b></span></div>
        <div class="tools">
          <button class="privacy-button" id="amount-privacy" type="button" aria-label="Приховати суми" title="Приховати суми" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="m3 3 18 18"/></svg></button>
          <span id="source-flag"></span>
          <span class="pill" title="Валюта звіту">EUR</span>
          <button class="chip" id="print" disabled><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9V2.5h12V9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="7.5"/></svg>Звіт / PDF</button>
        </div>
      </div>
      <div id="periods"></div>
    </div>
    <div id="screen" aria-live="polite"><p class="empty">Завантажую фінансовий простір…</p></div>
    <footer class="footer"><span id="coverage"></span><span>Оригінали виписок збережені</span></footer>
  </main>
</div>
<dialog id="dialog" aria-labelledby="drawer-title"><div class="drawer" id="drawer"></div></dialog>
<div id="notice" role="status" hidden></div>
<div id="print-report"></div>
</body>
</html>
