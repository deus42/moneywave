<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>MoneyWave</title>
<link rel="icon" type="image/png" href="/moneywave-mark.png">
<link rel="apple-touch-icon" href="/moneywave-mark.png">
<link rel="stylesheet" href="/style.css">
<script src="/app.js" type="module"></script>
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="header-inner">
      <div class="brand"><img class="brand-logo" src="/moneywave-mark.png" width="38" height="38" alt="">MoneyWave</div>
      <nav class="nav" aria-label="Розділи">
        <button disabled data-page="overview">Огляд</button>
        <button disabled data-page="budget">Бюджет</button>
        <button disabled data-page="cash">Готівка</button>
        <button disabled data-page="events">Поїздки</button>
        <button disabled data-page="purchases">Покупки</button>
        <button disabled data-page="transactions">Операції</button>
      </nav>
      <div class="header-tools">
        <button class="history-button" id="history" disabled aria-label="Історія правок" title="Історія правок"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7.5V12l3 2"/></svg></button>
        <button class="privacy-button" id="amount-privacy" type="button" aria-label="Приховати суми" title="Приховати суми" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="m3 3 18 18"/></svg></button>
      </div>
    </div>
  </header>
  <main class="workspace">
    <div class="masthead">
      <div class="topbar">
        <div class="route-navigation"><div class="navigation-controls"><button id="navigation-back" class="chip navigation-back" data-action="back" disabled hidden>← Назад</button><button id="navigation-forward" class="chip navigation-back" data-action="forward" aria-label="Уперед" title="Уперед" hidden>→</button></div></div>

      </div>
      <div id="page-heading"></div>
      <div id="periods"></div>
    </div>
    <div id="screen" aria-live="polite"><p class="empty">Завантаження…</p></div>
    <section id="detail-page" class="detail-page" aria-labelledby="detail-title" hidden></section>

  </main>
</div>
<div id="notice" role="status" hidden></div>
<div id="print-report"></div>
</body>
</html>
